name: CI

# Runs on every pull request and on every push to main (trunk-based: PRs are
# squash-merged into main once every job here is green). No job talks to AWS
# and no AWS credentials exist in this repository's secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "" # clippy warnings stay warnings (team.md: no -D warnings)

jobs:
  # Library (GUI-independent) checks: format, lint, tests with line coverage.
  # Fastest feedback.
  rust-core:
    name: Rust library (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (library)
        run: cargo clippy -p local-sights-core --all-targets
      # Runs the unit and integration tests and fails below 80% line coverage
      # (team.md Testing Posture).
      - name: tests with line coverage (library, unit + integration)
        run: cargo llvm-cov -p local-sights-core --fail-under-lines 80
      - name: doc tests (library)
        run: cargo test -p local-sights-core --doc
      # The developer-only fetch_check example has its own argument tests
      # (--region); they never connect to AWS.
      - name: example tests (library)
        run: cargo test -p local-sights-core --examples

  # Front end: types, lint, format, tests with line coverage, bundle,
  # dependency audit.
  frontend:
    name: Front end (tsc, eslint, prettier, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: version consistency (Cargo.toml, Cargo.lock, package.json, tauri.conf.json)
        run: npm run check:version
      - name: typecheck
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint .
      - name: prettier
        run: npx prettier --check .
      - name: vitest with line coverage (fails below 80%)
        run: npm run test:coverage
      - name: vite build
        run: npx vite build
      - name: npm audit
        run: npm audit --audit-level=high

  # Dependency policy for Rust crates: advisories, licenses, bans, sources.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # feature selection lives in deny.toml ([graph] all-features = false:
          # only the features the workspace actually builds are checked)
          arguments: ""

  # The Tauri app (src-tauri) compiles against the OS WebView, so it is built
  # on every runner (Linux, macOS and, since 261015-windows-support, Windows);
  # workspace-wide clippy runs here because src-tauri cannot compile without
  # those system libraries, and the OS-specific code (cfg(unix), cfg(windows))
  # is checked and tested on its own OS. The job names are required status
  # checks of the main ruleset: keep them as they are.
  tauri-app:
    name: Tauri app (${{ matrix.os }})
    needs: [rust-core, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux WebKitGTK / GTK development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: front-end bundle (frontendDist for the app)
        run: npm run build
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets
      - name: build the app
        run: cargo build -p local-sights
      # The library's tests on macOS and Windows (team.md Testing Posture:
      # every OS runner). On Linux they already ran with coverage in rust-core.
      - name: tests (library)
        if: runner.os != 'Linux'
        run: cargo test -p local-sights-core
      # The app crate's own tests: starting and stopping the AWS CLI for the
      # SSO login, against a fake CLI (a shell script on Unix, a batch file
      # with PowerShell on Windows; no real AWS CLI, no AWS).
      - name: tests (app)
        run: cargo test -p local-sights
