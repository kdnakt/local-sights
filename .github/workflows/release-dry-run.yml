name: Release dry run

# Builds the unsigned macOS (Apple Silicon) .dmg on demand, without a tag and
# without publishing anything, so the macOS bundling step can be checked before
# tagging a release. Run it from the Actions tab ("Run workflow") on any branch;
# the .dmg is kept as a workflow artifact for 7 days. See docs/releasing.md.
#
# Read-only: it creates no Release and uses no secrets. No job talks to AWS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-dmg:
    name: Build .dmg (no publish)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Apple Silicon runner
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This runner is $(uname -m); the .dmg is built for Apple Silicon (arm64) only."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: version consistency
        run: npm run check:version
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - name: build the .dmg (unsigned)
        run: npm run tauri build -- --bundles dmg
      - name: exactly one Apple Silicon .dmg
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .dmg in target/release/bundle/dmg/, found ${#dmgs[@]}."
            exit 1
          fi
          case "${dmgs[0]}" in
            *aarch64*.dmg) echo "Built ${dmgs[0]}" ;;
            *)
              echo "::error::${dmgs[0]} is not an aarch64 (Apple Silicon) .dmg."
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-sights-dmg-dry-run
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
