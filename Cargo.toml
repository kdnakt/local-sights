[workspace]
resolver = "2"
members = ["crates/local-sights-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
local-sights-core = { path = "crates/local-sights-core" }
aws-config = "1"
aws-sdk-cloudwatchlogs = "1"
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", features = ["http-1x"] }
aws-smithy-types = "1"
home = "0.5"
fastrand = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# U4: IANA time zone data (DST rules) and the OS time zone name.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# U6: SHA-256 of the cache key for the cache file name (BR2.2). MIT OR
# Apache-2.0; the same version the AWS SDK already uses, so no new crate.
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3"
