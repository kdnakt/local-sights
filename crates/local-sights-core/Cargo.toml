[package]
name = "local-sights-core"
description = "GUI-independent core library of local-sights (CloudWatch Logs local viewer)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aws-config.workspace = true
aws-sdk-cloudwatchlogs.workspace = true
aws-credential-types.workspace = true
chrono.workspace = true
# U4: time zone conversion owned by TimeRangeModel (BR3.4, Q1). Both are
# MIT OR Apache-2.0 and send nothing anywhere.
chrono-tz.workspace = true
iana-time-zone.workspace = true
fastrand.workspace = true
home.workspace = true
regex.workspace = true
serde.workspace = true
# U6: the disk cache file is JSON Lines (code-generation Q1) and its name is
# the SHA-256 of the key (BR2.2). serde_json moved here from the dev
# dependencies; sha2 is MIT OR Apache-2.0. Neither sends anything anywhere.
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Retry waits (BR2.1) and the abort signal (BR2.3, BR5.5). The AWS SDK
# already depends on tokio, so this adds no new crate to the build.
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true

[dev-dependencies]
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
tempfile.workspace = true
# `test-util` lets retry tests advance a paused clock instead of waiting.
tokio = { workspace = true, features = ["test-util"] }

# examples/fetch_check.rs is a manual, developer-only check against real AWS
# (BR7.1). `cargo test` only compiles examples; it never runs them (BR7.2).
