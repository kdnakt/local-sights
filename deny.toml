# cargo-deny configuration (team.md Code Style: dependency checks in CI,
# including vulnerabilities). Run locally with `cargo deny check` after
# `cargo install cargo-deny --locked`.

[graph]
# Check the features the workspace actually builds with, not every optional one.
all-features = false

[advisories]
# Any known vulnerability or unmaintained/unsound advisory fails the check.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # proc-macro-error 1.0.4 is unmaintained (no vulnerability). It comes in only
  # through tauri -> gtk -> glib-macros (Linux GTK bindings) and cannot be
  # removed from this side; drop this entry once Tauri moves past it.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained only; transitive via tauri/gtk, not removable here" },
]

[licenses]
version = 2
# Permissive licenses only; the project itself is Apache-2.0. An expression
# such as "MIT OR Apache-2.0" passes when any alternative is allowed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
# Duplicate versions of one crate are reported but do not fail the build.
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (local-sights-core) carry no version; that is fine.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Crates come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
