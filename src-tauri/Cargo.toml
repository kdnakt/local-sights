[package]
name = "local-sights"
description = "Desktop app (Tauri) of local-sights, a local CloudWatch Logs viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "local_sights_app"
path = "src/lib.rs"

[[bin]]
name = "local-sights"
path = "src/main.rs"

[features]
# Embeds the built screen (`dist/`) instead of loading the Vite dev server.
# `npm run tauri build` enables it automatically; enable it yourself for a
# plain `cargo build --release` or `cargo install` (see README.md).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# 261011-sso-login: `killpg` stops the whole process group of the AWS CLI
# on cancel, time-out and exit (BR3.3). Already in the build through the
# other crates; MIT OR Apache-2.0.
libc = "0.2"
local-sights-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true

[dev-dependencies]
# Fake AWS CLI scripts of the sso_cli tests live in temporary folders.
tempfile.workspace = true
