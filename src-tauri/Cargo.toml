[package]
name = "local-sights"
description = "Desktop app (Tauri) of local-sights, a local CloudWatch Logs viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "local_sights_app"
path = "src/lib.rs"

[[bin]]
name = "local-sights"
path = "src/main.rs"

[features]
# Embeds the built screen (`dist/`) instead of loading the Vite dev server.
# `npm run tauri build` enables it automatically; enable it yourself for a
# plain `cargo build --release` or `cargo install` (see README.md).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
local-sights-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
# 261022-small-features U2 (ADR-002): the save dialog and the clipboard of
# the export, used by `export_boundary` from the Rust side only.
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
# 261022-small-features U2:BR4.6: the random part of the export's temporary
# file name (the same crate the core uses for its cache files).
fastrand.workspace = true
# 261022-small-features U2:BR4.5: the time the export snapshot was taken.
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
# 261011-sso-login: `killpg` stops the whole process group of the AWS CLI
# on cancel, time-out and exit (BR3.3). Already in the build through the
# other crates; MIT OR Apache-2.0.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 261015-windows-support: the job object that stops the AWS CLI with
# everything it started (FR4.3, FR4.4) and `ShellExecuteW` for the default
# browser (FR4.5). The version Tauri already builds (Cargo.lock);
# MIT OR Apache-2.0. `Win32_Security` only names the security-attributes
# type `CreateJobObjectW` takes; `Win32_UI_WindowsAndMessaging` the show
# command `ShellExecuteW` takes.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Fake AWS CLI scripts of the sso_cli tests live in temporary folders.
tempfile.workspace = true
